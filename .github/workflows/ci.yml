name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly self-check: tools that break after an environment change surface without a push.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: No em or en dash
        shell: bash
        run: bash tools/check-no-dashes/check-no-dashes --tree

      - name: Secret scan (gitleaks)
        shell: bash
        run: |
          set -euo pipefail
          tools="$(mktemp -d)"
          trap 'rm -rf "$tools"' EXIT
          GOFLAGS= GOBIN="$tools" go install github.com/zricethezav/gitleaks/v8@v8.30.0
          "$tools/gitleaks" git --no-banner --redact

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          env -u GOFLAGS go version
          node --version
          just --version
          shellcheck --version | sed -n 2p
          jq --version

      - name: Vet
        shell: bash
        run: env -u GOFLAGS go vet ./...

      - name: Test
        shell: bash
        run: env -u GOFLAGS go test ./...

      - name: Build
        shell: bash
        run: just build

      - name: Tool admission gates
        shell: bash
        run: bin/rice-agent check --all

      - name: Script tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy.test.sh
          bash scripts/worktree-doctor.test.sh
