name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly self-check: tools that break after an environment change surface without a push.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, generic]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: No em or en dash
        shell: bash
        run: bash tools/check-no-dashes/check-no-dashes --tree

      - name: Secret scan (gitleaks)
        shell: bash
        run: |
          set -euo pipefail
          tools="$(mktemp -d)"
          trap 'rm -rf "$tools"' EXIT
          GOFLAGS= GOBIN="$tools" go install github.com/zricethezav/gitleaks/v8@v8.30.0
          "$tools/gitleaks" git --no-banner --redact

  go:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, generic]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v go >/dev/null 2>&1; then
            echo "::error::go is not installed on this runner; the go job needs Go 1.27 or newer"
            exit 1
          fi
          env -u GOFLAGS go version
          if [ ! -x /usr/local/bin/mise ]; then
            echo "::error::mise is unavailable; the canonical-gate tests need Node 24.18.0"
            exit 1
          fi
          node_dir=$(MISE_DATA_DIR=/opt/mise /usr/local/bin/mise where node@24.18.0)
          if [ "$node_dir" != /opt/mise/installs/node/24.18.0 ] || [ ! -x "$node_dir/bin/node" ]; then
            echo "::error::mise Node 24.18.0 is unavailable at the provisioned runner path"
            exit 1
          fi
          if [ "$(stat -c %u "$node_dir/bin")" != 0 ]; then
            echo "::error::mise Node 24.18.0 must be root-owned on this runner"
            exit 1
          fi
          node_version=$("$node_dir/bin/node" --version)
          if [ "$node_version" != v24.18.0 ]; then
            echo "::error::expected mise Node 24.18.0, got $node_version"
            exit 1
          fi
          echo "$node_dir/bin" >> "$GITHUB_PATH"
          missing=""
          for cmd in shellcheck jq; do
            command -v "$cmd" >/dev/null 2>&1 || missing="$missing $cmd"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing on this runner:$missing; rice-agent check needs them for gates G4 and G5"
            exit 1
          fi
          shellcheck --version | sed -n 2p
          jq --version

      - name: Vet
        shell: bash
        run: env -u GOFLAGS go vet ./...

      - name: Test
        shell: bash
        run: env -u GOFLAGS go test ./...

      - name: Build
        shell: bash
        run: just build

      - name: Tool admission gates
        shell: bash
        run: bin/rice-agent check --all

      - name: Script tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy.test.sh
          bash scripts/worktree-doctor.test.sh
